<link rel="stylesheet" href="app.css">
<!-- Undoes 404.html's redirect: GitHub Pages has no real file for a path like /plus, so 404.html sends the
     browser to /?/plus instead; this restores the real /plus URL via the History API before app.js's router
     reads location.pathname. See https://github.com/rafgraph/spa-github-pages for the technique. -->
<script>
  (function(l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function(s) { return s.replace(/~and~/g, '&'); }).join('?');
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  }(window.location));
</script>

<script src="vendor/supabase.js"></script>
<script src="emoji.js"></script>
<script src="app.js"></script>
<script>
  // Registered last, after app.js has defined the page - installability (manifest + a fetch handler) is what
  // lets iOS/Android offer "Add to Home Screen", and it also gives the app shell a moment's offline resilience.
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
